name: Deploy

on:
  # workflow_dispatch enables the manual "Run workflow" button that the
  # README's fork instructions rely on. (A bare `workflow_run:` is not a
  # valid trigger and made the whole workflow fail at startup.)
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-node@v4
        with: { node-version: 22.x, cache: "npm" }
      - run: npm ci
      - run: npm run build
        env:
          REPO_BASE: ${{ vars.REPO_BASE }}
          # Optional. Without it the map falls back to the key committed in
          # src/components/map/shelfMap.tsx, which is what forks get. A key
          # in a browser is public either way — the protection is the domain
          # restriction set in the Stadia dashboard, not this variable.
          VITE_STADIA_API_KEY: ${{ vars.VITE_STADIA_API_KEY }}
      - uses: actions/upload-pages-artifact@v3
        with: { path: ./dist }
      - uses: actions/deploy-pages@v4

    permissions:
      id-token: write
      pages: write
      contents: read
